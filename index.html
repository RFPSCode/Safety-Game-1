<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>校園安全時光機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bcd9f2;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;color:#2b2140;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;transition:filter .4s}
body.rewinding #cv{filter:sepia(.85) saturate(1.3) hue-rotate(-12deg) contrast(1.05)}
body.slowmo #cv{filter:saturate(.55) contrast(1.08)}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:12px 26px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#ff8a3d,#f0602a);box-shadow:0 5px 0 #b8421b,0 8px 18px rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8421b}
.btn.blue{background:linear-gradient(#4aa8ff,#2d7fe0);box-shadow:0 5px 0 #1d58a3,0 8px 18px rgba(0,0,0,.25)}
.btn.green{background:linear-gradient(#5ccf6e,#2fa84a);box-shadow:0 5px 0 #1f7a34,0 8px 18px rgba(0,0,0,.25)}
.btn.gray{background:linear-gradient(#9aa3b5,#78839a);box-shadow:0 5px 0 #545d70}
.panel{background:rgba(255,253,246,.96);border-radius:22px;box-shadow:0 10px 30px rgba(40,30,80,.28);border:3px solid #fff}

/* title */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4vh 16px;z-index:30;pointer-events:none}
#title .logo{pointer-events:none;text-align:center;filter:drop-shadow(0 4px 0 #fff) drop-shadow(0 8px 14px rgba(0,0,0,.25))}
#title h1{margin:0;font-size:clamp(34px,7vw,68px);font-weight:900;color:#203a8f;letter-spacing:2px;-webkit-text-stroke:2px #fff;paint-order:stroke fill}
#title h1 b{color:#e8304f}
#title .sub{display:inline-block;margin-top:8px;background:#ffe45c;border-radius:14px;padding:6px 18px;font-size:clamp(16px,2.6vw,24px);font-weight:900;color:#3a2a10}
#title .box{pointer-events:auto;padding:18px 22px;text-align:center;width:min(560px,96vw)}
#title .row{display:flex;gap:10px;justify-content:center;align-items:center;margin:8px 0;flex-wrap:wrap}
#title .lab{font-weight:900;font-size:17px;color:#5a4a7a;margin-right:4px}
.chip{border:3px solid #e2dcef;background:#fff;border-radius:16px;padding:8px 16px;font-size:18px;font-weight:700;color:#4a3d66}
.chip.on{border-color:#ff8a3d;background:#fff3e8;color:#d4551d}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d8d0e6}
.sw.on{box-shadow:0 0 0 4px #ff8a3d}
#title .note{font-size:13px;color:#7a7090;margin-top:10px;line-height:1.5}

/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .top{position:absolute;left:12px;top:12px;display:flex;gap:10px;align-items:center;pointer-events:auto}
#hud .badges{display:flex;gap:6px;padding:8px 12px;align-items:center}
#hud .badges .bd{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#e9e4f0;filter:grayscale(1);opacity:.55}
#hud .badges .bd.on{background:radial-gradient(#fff6b0,#ffc93c);filter:none;opacity:1;box-shadow:0 0 0 3px #fff,0 0 12px #ffcf3c}
#hud .badges .lab{font-weight:900;font-size:15px;color:#5a4a7a;margin-right:4px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:#fffdf6;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.2);pointer-events:auto}
#topR{position:fixed;right:12px;top:12px;display:flex;gap:8px;z-index:26}
#dest{position:absolute;right:12px;top:72px;width:min(300px,44vw);padding:12px;pointer-events:auto}
#dest h3{margin:2px 4px 8px;font-size:18px;color:#3d2f66}
.dcard{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:3px solid transparent;background:#fff;border-radius:16px;padding:8px 10px;margin-bottom:8px;box-shadow:0 2px 6px rgba(60,40,100,.12)}
.dcard.on{border-color:#ff8a3d;background:#fff4e9}
.dcard .ic{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:#eef3ff;border-radius:12px;flex:none}
.dcard .tx b{display:block;font-size:16px;color:#2b2140}
.dcard .tx span{font-size:13px;color:#7a6f92}
.dcard .st{margin-left:auto;font-size:13px;font-weight:900;color:#2fa84a;white-space:nowrap}
.dcard .st.todo{color:#e8304f}
#dest .more{font-size:12.5px;color:#8a80a0;text-align:center;margin-top:2px}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 18px;font-size:15px;font-weight:700;color:#4a3d66;white-space:nowrap}
#near{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);padding:14px 20px;text-align:center;pointer-events:auto;width:min(440px,92vw);animation:pop .3s}
#near .t{font-size:20px;font-weight:900;color:#d4551d}
#near .d{font-size:15px;margin:6px 0 12px;color:#4a3d66;line-height:1.5}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#joy{position:absolute;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.8);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 3px 10px rgba(0,0,0,.25)}

/* story */
#story{position:fixed;inset:0;pointer-events:none;z-index:20}
#story .lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .5s}
#story .lb.t{top:0}#story .lb.b{bottom:0}
#story.on .lb{height:7vh}
#vig{position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45));opacity:0;transition:opacity .5s}
#vig.on{opacity:1}
#vig.warm{opacity:1;background:radial-gradient(ellipse at center,transparent 42%,rgba(255,140,165,.4))}
.bravo{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:39;pointer-events:none;font-size:clamp(34px,7vw,76px);font-weight:900;color:#fff;white-space:nowrap;-webkit-text-stroke:3px #f08a1c;paint-order:stroke fill;text-shadow:0 0 24px #ffd84d,0 6px 0 #c96a00;animation:bravo 2.1s ease-out forwards}
@keyframes bravo{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1.05);opacity:0}}
#vig.devil{background:radial-gradient(ellipse at center,transparent 50%,rgba(90,0,40,.55))}
#sub{position:absolute;left:50%;bottom:calc(7vh + 14px);transform:translateX(-50%);width:min(900px,95vw);display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
#sub .pt{width:96px;height:96px;flex:none;border-radius:50%;background:#fff center/cover no-repeat;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35);display:grid;place-items:center;font-size:48px}
#sub .bx{flex:1;padding:12px 18px 10px;position:relative;min-height:96px}
#sub .nm{position:absolute;top:-16px;left:16px;background:#2d7fe0;color:#fff;font-weight:900;font-size:17px;padding:3px 14px;border-radius:12px}
#sub .tx{font-size:clamp(18px,2.2vw,24px);font-weight:700;line-height:1.55;color:#2b2140;min-height:2.6em;padding-top:6px}
#sub .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#sub .nx{border:0;border-radius:14px;padding:8px 18px;font-size:17px;font-weight:900;background:#c9c3d6;color:#fff;transition:background .3s}
#sub .nx.ready{background:#ff7a33;box-shadow:0 3px 0 #b8421b;animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
#sub.devil .nm{background:#6a2a5a}#sub.devil .bx{background:#f8eef6}
#sub.angel .nm{background:#e8a51c}
#sub.nar .nm{background:#5d6b84}
#sub.me .nm{background:#2fa84a}
#sub.teacher .nm{background:#7a5bd0}

#choice{position:fixed;left:50%;bottom:calc(7vh + 14px);transform:translateX(-50%);width:min(760px,95vw);padding:16px;z-index:22;pointer-events:auto}
#choice .q{font-size:clamp(19px,2.4vw,24px);font-weight:900;color:#3d2f66;margin:0 4px 12px;display:flex;align-items:center;gap:8px}
#choice .opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-size:clamp(17px,2.2vw,21px);font-weight:700;padding:12px 16px;border-radius:16px;border:3px solid #ddd5ee;background:#fff;color:#2b2140;transition:transform .12s}
.opt:hover{transform:scale(1.015)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eef3ff;color:#2d7fe0;font-weight:900}
.opt.devil{border-color:#c5307a;background:linear-gradient(90deg,#ffe6f2,#fff);box-shadow:0 0 0 0 rgba(197,48,122,.6);animation:dglow 1.4s infinite}
.opt.devil .k{background:#c5307a;color:#fff}
@keyframes dglow{50%{box-shadow:0 0 18px 4px rgba(197,48,122,.45)}}
.opt.locked{color:transparent;text-shadow:0 0 9px rgba(60,50,90,.55);background:#f1eef6;border-style:dashed;position:relative}
.opt.locked .k{color:#999;background:#e3e0ea;text-shadow:none}
.opt.locked::after{content:'🔒 良心的聲音被小惡魔蓋住了……';position:absolute;right:14px;font-size:14px;color:#8a80a0;text-shadow:none}
.opt.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#choice .tag{font-size:13px;font-weight:900;padding:3px 10px;border-radius:10px;background:#ffe2ef;color:#c5307a}
#choice .tag.a{background:#fff3c9;color:#b67b00}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .5s}
#flash{position:fixed;inset:0;pointer-events:none;z-index:41;opacity:0}
#rw{position:fixed;inset:0;z-index:35;display:grid;place-items:center;pointer-events:none}
#rw .c{width:min(260px,50vw);height:min(260px,50vw);position:relative;opacity:.9;filter:drop-shadow(0 0 20px #fff6c0)}
#rw .c svg{width:100%;height:100%}
#rw .hand{transform-origin:100px 100px;animation:back 0.6s linear infinite}
#rw .hand2{transform-origin:100px 100px;animation:back 3.6s linear infinite}
@keyframes back{to{transform:rotate(-360deg)}}
#rw .t{position:absolute;left:0;right:0;bottom:16vh;text-align:center;font-size:clamp(26px,4vw,44px);font-weight:900;color:#fff;text-shadow:0 0 12px #c49a2c,0 3px 0 #8a5e10}

.ovl{position:fixed;inset:0;z-index:36;display:grid;place-items:center;background:rgba(30,20,60,.45);padding:12px;pointer-events:auto}
.ovl .panel{width:min(620px,96vw);max-height:92vh;overflow:auto;padding:22px 24px;text-align:center;animation:pop2 .35s}
@keyframes pop2{from{transform:scale(.7);opacity:0}}
.ovl h2{margin:0 0 6px;font-size:clamp(24px,3.6vw,34px);font-weight:900;color:#203a8f}
.ovl p{font-size:18px;line-height:1.6;margin:8px 0}
.case{border-radius:18px;background:#fff;border:3px solid #f1d9de;padding:14px 16px;text-align:left;margin:10px 0}
.case .hd{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;color:#2b2140}
.case .no{width:38px;height:38px;border-radius:50%;background:#e8304f;color:#fff;display:grid;place-items:center;font-size:20px}
.case .ds{font-size:18px;margin:10px 0;line-height:1.6}
.pill{display:inline-block;background:#e8304f;color:#fff;font-weight:900;font-size:22px;padding:6px 22px;border-radius:999px;box-shadow:0 3px 0 #a3162f}
.pill.blue{background:#2d7fe0;box-shadow:0 3px 0 #1d58a3}
.laws{text-align:left;margin-top:12px}
.law{display:flex;gap:10px;align-items:flex-start;background:#f3f6ff;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:16px;line-height:1.55}
.law b{color:#203a8f}
.law .n{flex:none;width:28px;height:28px;border-radius:50%;background:#203a8f;color:#fff;display:grid;place-items:center;font-weight:900}
.src{font-size:12px;color:#8a80a0;margin-top:10px}
.badgeBig{font-size:86px;width:150px;height:150px;margin:6px auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#fff9c9,#ffc93c 70%,#f0a020);box-shadow:0 0 0 6px #fff,0 0 40px #ffd75a;animation:spin 3s ease-in-out infinite}
@keyframes spin{50%{transform:rotateY(180deg) scale(1.06)}}
.stars{font-size:40px;color:#ffc21a;letter-spacing:6px;text-shadow:0 3px 0 #c98a00}
.ovl .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.over h2{color:#c0213f}
.why{background:#fff1f3;border-radius:14px;padding:10px 14px;font-size:17px;line-height:1.6;text-align:left;margin:10px 0}
.tip{background:#fff8dc;border-radius:14px;padding:10px 14px;font-size:17px;line-height:1.6;text-align:left}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:45;padding:10px 22px;font-size:20px;font-weight:900;color:#2b2140;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
#err{position:fixed;inset:0;display:grid;place-items:center;z-index:99;background:#fdf6e3;padding:20px;text-align:center;font-size:20px}
@media (max-width:700px){
 #sub .pt{width:64px;height:64px;font-size:34px}
 #dest{top:auto;bottom:12px;right:8px;width:min(260px,58vw);padding:8px}
 #dest .dcard .tx span{display:none}
 #dest h3{font-size:15px}
 #hint{display:none}
 #hud .badges .bd{width:32px;height:32px;font-size:18px}
}
@media (prefers-reduced-motion:reduce){.opt.devil,.badgeBig,#sub .nx.ready{animation:none}}

/* ===== design system v2 ===== */
:root{--navy:#1d2466;--ink:#2a2f6b;--cream:#fffaf0}
.panel{background:linear-gradient(#fffdf8,#fff3dc);border:3px solid var(--ink);border-radius:22px;box-shadow:inset 0 2px 0 #fff,0 6px 0 rgba(29,36,102,.3),0 16px 30px rgba(15,18,60,.28)}
.btn{position:relative;overflow:hidden;border:3px solid #7a2a00;background:linear-gradient(#ffc04f,#ff8424 55%,#f25a10);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(150,45,0,.3),0 6px 0 #7a2a00,0 14px 22px rgba(0,0,0,.28);text-shadow:0 2px 0 rgba(120,40,0,.55);letter-spacing:2px;padding:12px 30px}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.8s infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 2px 0 #7a2a00}
.btn:disabled{filter:grayscale(.6);opacity:.85}
.btn.blue{border-color:#12357a;background:linear-gradient(#6cc0ff,#2f8ae8 55%,#1f66c9);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(10,40,110,.3),0 6px 0 #12357a,0 14px 22px rgba(0,0,0,.28);text-shadow:0 2px 0 rgba(10,40,110,.6)}
.btn.green{border-color:#16592a;background:linear-gradient(#8be07a,#3cb654 55%,#27963f);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(10,80,30,.3),0 6px 0 #16592a,0 14px 22px rgba(0,0,0,.28);text-shadow:0 2px 0 rgba(10,80,30,.6)}
.btn.gray{border-color:#3d4458;background:linear-gradient(#b8c0d2,#8791a8 55%,#6c768e);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 6px 0 #3d4458;text-shadow:0 2px 0 rgba(40,45,60,.6)}
.iconbtn{border:3px solid var(--ink);background:linear-gradient(#fffdf8,#ffeecb);box-shadow:inset 0 2px 0 #fff,0 4px 0 rgba(29,36,102,.35);width:50px;height:50px}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(29,36,102,.35)}
/* title */
#title{justify-content:flex-start;padding:3vh 16px 0}
.tscrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(70,140,235,.55),rgba(120,190,255,0) 36%),linear-gradient(0deg,rgba(18,22,80,.78),rgba(18,22,80,0) 46%)}
.tspark i{position:absolute;width:10px;height:10px;background:#fff;border-radius:50%;box-shadow:0 0 14px 5px rgba(255,240,170,.9);opacity:0;animation:tsp 4s infinite}
.tspark i:nth-child(1){left:12%;top:30%}.tspark i:nth-child(2){left:84%;top:22%;animation-delay:.8s}.tspark i:nth-child(3){left:70%;top:52%;animation-delay:1.6s}.tspark i:nth-child(4){left:24%;top:58%;animation-delay:2.2s}.tspark i:nth-child(5){left:48%;top:12%;animation-delay:3s}.tspark i:nth-child(6){left:92%;top:66%;animation-delay:1.2s}
@keyframes tsp{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
#title .logo{position:relative;filter:none;display:flex;flex-direction:column;align-items:center;animation:floaty 4s ease-in-out infinite;transform-origin:center}
@keyframes floaty{50%{transform:translateY(-8px) rotate(-.6deg)}}
#title .emb{width:clamp(64px,10vw,104px);height:auto;margin-bottom:-18px;z-index:2;filter:drop-shadow(0 5px 0 rgba(15,18,70,.45))}
.emb .eh1{transform-origin:60px 60px;animation:back 3s linear infinite}.emb .eh2{transform-origin:60px 60px;animation:back 14s linear infinite}
#title h1{font-size:clamp(44px,9.5vw,104px);line-height:1.05;letter-spacing:4px;transform:rotate(-2.5deg);-webkit-text-stroke:0;color:inherit;filter:drop-shadow(0 8px 0 #11164a) drop-shadow(0 16px 18px rgba(0,0,20,.4))}
#title h1 span{-webkit-text-stroke:clamp(8px,1.4vw,14px) #1d2466;paint-order:stroke fill}
#title h1 .l1{color:#fff}#title h1 .l2{color:#ffd23f;margin-left:.08em;text-shadow:0 -3px 0 #fff3b0 inset}
#title .sub{position:relative;margin-top:6px;background:none;padding:0;transform:rotate(-2.5deg)}
#title .sub span{position:relative;display:inline-block;background:linear-gradient(#ff5d6c,#e8304f);color:#fff;border:3px solid #7a1026;border-radius:10px;padding:6px 26px;font-size:clamp(17px,2.7vw,28px);font-weight:900;letter-spacing:2px;box-shadow:0 5px 0 #7a1026,0 10px 16px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(120,10,30,.6)}
#title .box{position:absolute;left:50%;bottom:max(46px,5vh);transform:translateX(-50%);width:min(720px,94vw);padding:16px 20px;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
#title .row{margin:0;gap:10px}
#title .lab{font-size:16px;color:var(--ink);letter-spacing:1px}
.chip.pc{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;padding:8px 6px 6px;border:3px solid #c9c3e0;border-radius:18px;background:linear-gradient(#fff,#f1eeff);position:relative;transition:transform .12s;box-shadow:0 4px 0 #c9c3e0}
.chip.pc .ph{width:68px;height:68px;border-radius:50%;background:#dfeaff center/cover no-repeat;display:grid;place-items:center;font-size:36px;border:3px solid #fff;box-shadow:0 0 0 2px #c9c3e0}
.chip.pc b{font-size:17px;color:var(--ink)}
.chip.pc.on{border-color:#ff8a1f;background:linear-gradient(#fff8e6,#ffe9bd);box-shadow:0 4px 0 #c96a00,0 0 0 4px rgba(255,200,60,.55),0 0 22px rgba(255,190,60,.8);transform:translateY(-4px)}
.chip.pc.on .ph{box-shadow:0 0 0 3px #ff8a1f}
.chip.pc.on::after{content:'✓';position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;background:#3cb654;color:#fff;font-weight:900;display:grid;place-items:center;border:3px solid #fff;font-size:15px}
.startw{display:flex;flex-direction:column;align-items:center;gap:8px}
.btn.big{font-size:clamp(22px,3vw,30px);padding:14px 44px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.045)}}
#title .note{margin:0;font-size:13px;color:#6a6390;text-align:center}

async function fetchBuf(url,onProg){

  return buf.buffer;}
function loadBuf(id,onProg){if(!VLOAD[id])VLOAD[id]=fetchBuf(VRM_FILES[id],onProg).then(b=>(VBUF[id]=b)).catch(e=>{console.warn('VRM',id,e);VLOAD[id]=null;throw e;});return VLOAD[id];}

  return vrm;}

const panoTex=new THREE.TextureLoader().load(PANO_URL,t=>{t.needsUpdate=true;});
panoTex.colorSpace=THREE.SRGBColorSpace;panoTex.wrapS=THREE.RepeatWrapping;panoTex.repeat.x=-1;panoTex.offset.x=0.62;
const PANO_R=260,PANO_H=2*PI*PANO_R/(2576/489);
const panoGeo=new THREE.CylinderGeometry(PANO_R,PANO_R,PANO_H,96,1,true);
const panoMat=new THREE.MeshBasicMaterial({map:panoTex,side:THREE.BackSide,fog:false,depthWrite:false});panoMat.toneMapped=false;
function addPano(sc,groundY=0,rotY=0){const m=new THREE.Mesh(panoGeo,panoMat);m.position.y=groundY+4-PANO_H*0.235+PANO_H/2;m.rotation.y=rotY;m.renderOrder=-10;sc.add(m);
  sc.background=new THREE.Color('#a9cbec');return m;}
function addLights(sc,{sun=2.1,hemi=1.25,shadowR=40,dir=[-30,45,20],target=[0,0,0]}={}){
  const h=new THREE.HemisphereLight(0xdcebff,0xb8a68e,hemi);sc.add(h);
  const d=new THREE.DirectionalLight(0xfff1dc,sun);d.position.set(...dir).add(new V3(...target));d.target.position.set(...target);sc.add(d,d.target);
  if(!SLOW){d.castShadow=true;d.shadow.mapSize.set(2048,2048);const s=d.shadow.camera;s.left=s.bottom=-shadowR;s.right=s.top=shadowR;s.near=1;s.far=200;d.shadow.bias=-0.0006;d.shadow.normalBias=0.02;}
  return d;}

const TEX={
  pink:tileTex('#dba79e','#efd9d2',14,12),
  pinkSm:tileTex('#dba79e','#efd9d2',10,12),
  yellow:tileTex('#ead45a','#f6ec9c',22,16),
  pave:canvasTex(512,512,(g,w,h)=>{g.fillStyle='#b9a58c';g.fillRect(0,0,w,h);const bw=64,bh=32;for(let y=0;y<h/bh;y++)for(let x=-1;x<w/bw+1;x++){const k=0.86+rnd()*0.24;const c=new THREE.Color(rnd()<0.18?'#9d8f84':'#d2bfa3').multiplyScalar(k);g.fillStyle='#'+c.getHexString();g.fillRect(x*bw+(y%2)*bw/2+2,y*bh+2,bw-4,bh-4);}},[90,90]),
  grass:canvasTex(256,256,(g,w,h)=>{g.fillStyle='#7da64a';g.fillRect(0,0,w,h);for(let i=0;i<2600;i++){g.fillStyle=rnd()<.5?'#6b953c':'#93b85c';g.fillRect(rnd()*w,rnd()*h,2,4);}for(let i=0;i<60;i++){g.fillStyle='#a69a7c';g.fillRect(rnd()*w,rnd()*h,5,4);}},[3,3]),
  floor:tileTex('#e3ddd0','#c9c1b1',4,6),
  terrazzo:canvasTex(256,256,(g,w,h)=>{g.fillStyle='#bfbcb5';g.fillRect(0,0,w,h);for(let i=0;i<1600;i++){g.fillStyle=['#8f8c86','#dad7d0','#a7a39b','#6f6c67'][i%4];g.fillRect(rnd()*w,rnd()*h,2+rnd()*3,2+rnd()*3);}},[2,2]),
};
function uvBox(w,h,d,s=0.5){const g=new THREE.BoxGeometry(w,h,d);const uv=g.attributes.uv;const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let v=0;v<4;v++){const i=f*4+v;uv.setXY(i,uv.getX(i)*dims[f][0]*s,uv.getY(i)*dims[f][1]*s);}return g;}

/* merge batches */
function Batch(){const B={};return{put(kind,geo,m4){(B[kind]||(B[kind]=[])).push(geo.clone().applyMatrix4(m4));},
  build(par,mats,shadow=true){for(const k in B){const g=mergeGeometries(B[k],false);const m=new THREE.Mesh(g,mats[k]);m.castShadow=shadow&&!/glass|lamp|ring/.test(k);m.receiveShadow=true;par.add(m);}}};}
const M4=(x,y,z,ry=0,rx=0,rz=0,s=[1,1,1])=>new THREE.Matrix4().compose(new V3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz,'YXZ')),new V3(...s));
const polar=(th,r)=>[Math.sin(th)*r,-Math.cos(th)*r];
const arcM=(th,r,y,s=[1,1,1])=>{const [x,z]=polar(th,r);return M4(x,y,z,PI-th,0,0,s);};
const D2R=PI/180;

/* trees */
function cedar(Bt,x,z,h=12){Bt.put('trunk',cyl(0.22,0.32,h*0.5,8),M4(x,h*0.25,z));for(let i=0;i<4;i++){const r=2.3-i*0.45,hh=h*0.36;Bt.put('cedar',cone(r,hh,10),M4(x,h*0.32+i*h*0.17,z,rnd()*3));}}
function broad(Bt,x,z,s=1,planter=true){if(planter){Bt.put('planter',cyl(1.0*s,1.05*s,0.45,20),M4(x,0.225,z));Bt.put('soil',cyl(0.92*s,0.92*s,0.05,16),M4(x,0.46,z));}
  Bt.put('trunk',cyl(0.12*s,0.18*s,3.2*s,8),M4(x,1.6*s,z));
  const blobs=[[0,4.1,0,1.5],[0.9,3.6,0.3,1.1],[-0.8,3.7,-0.2,1.15],[0.2,3.5,-0.9,1.0],[-0.3,4.6,0.6,0.95],[0.3,3.2,0.9,0.9]];
  blobs.forEach(b=>Bt.put('leaf',new THREE.IcosahedronGeometry(b[3]*s,1),M4(x+b[0]*s,b[1]*s,z+b[2]*s,rnd()*3)));}
function car(Bt,x,z,ry,col){const k='car'+col;Bt.put(k,uvBox(1.8,0.7,4.0),M4(x,0.65,z,ry));Bt.put('glass',uvBox(1.6,0.6,2.1),M4(x,1.28,z-0.0,ry));
  [[-0.85,-1.3],[0.85,-1.3],[-0.85,1.3],[0.85,1.3]].forEach(([a,b])=>{const c=Math.cos(ry),s=Math.sin(ry);Bt.put('tire',cyl(0.34,0.34,0.24,12),M4(x+a*c+b*s,0.34,z-a*s+b*c,ry,0,PI/2));});}

const ENV_MATS=()=>({floor:toon('#ffffff',{map:TEX.floor}),pink:toon('#ffffff',{map:TEX.pink}),pinkSm:toon('#ffffff',{map:TEX.pinkSm}),yellow:toon('#ffffff',{map:TEX.yellow}),slab:toon('#d9d4cc'),dark:toon('#4a4a52'),roof:toon('#5d5f66'),
  rail:toon('#3f8c88'),glass:toon('#3d5d70'),door:toon('#9a6b43'),white:toon('#f2efe9'),red:toon('#d8475a'),trunk:toon('#7a5a3c'),cedar:toon('#2f6a3c'),leaf:toon('#5f9a44'),
  planter:toon('#d8d2c6'),soil:toon('#6b5240'),tire:toon('#242428'),carw:toon('#f4f4f4'),carb:toon('#2a2c33'),cars:toon('#a9b1bd'),carr:toon('#b8323d'),lamp:toon('#fffbe6',{unlit:true}),
  curb:toon('#c7b49c'),brick:toon('#a8846a'),cream:toon('#f1ead8'),green:toon('#7fae9a'),teal:toon('#3f8c88'),metal:toon('#8d96a3'),yel:toon('#ffd23f'),ring:toon('#9c8a76')});

function markEnv(sc){sc.traverse(o=>{if(o.isMesh&&o.renderOrder!==-10)o.userData.env=true;});sc.userData.env=null;return sc;}
/* --- campus --- */
const CAMPUS={R:36,th0:-118*D2R,th1:-8*D2R};
function buildCampus(){
  const sc=new THREE.Scene();sc.fog=new THREE.Fog('#dfe9f2',90,250);addPano(sc,0,0);
  const sun=addLights(sc,{shadowR:45});
  const B=Batch(),mats=ENV_MATS();const R=CAMPUS.R,H=3.6,F=4;
  const g=new THREE.Mesh(new THREE.CircleGeometry(250,64),toon('#ffffff',{map:TEX.pave}));g.rotation.x=-PI/2;g.receiveShadow=true;sc.add(g);
  [12,22].forEach(r=>{const m=new THREE.Mesh(new THREE.RingGeometry(r-0.35,r+0.35,96),toon('#9c8a76'));m.rotation.x=-PI/2;m.position.y=0.01;m.receiveShadow=true;sc.add(m);});
  [[-14,-6,5],[4,-12,4.5],[16,4,4]].forEach(([x,z,r])=>{const m=new THREE.Mesh(new THREE.CircleGeometry(r,40),toon('#ffffff',{map:TEX.grass}));m.rotation.x=-PI/2;m.position.set(x,0.03,z);m.receiveShadow=true;sc.add(m);
    B.put('curb',new THREE.TorusGeometry(r,0.16,6,48),M4(x,0.06,z,0,PI/2));});
  // curved main building
  const dth=4*D2R;
  for(let th=CAMPUS.th0;th<CAMPUS.th1-0.001;th+=dth){
    const tm=th+dth/2;const w=2*(R+10)*Math.sin(dth/2)+0.05,wi=2*R*Math.sin(dth/2)+0.04;
    for(let f=0;f<F;f++){
      B.put('pink',uvBox(2*(R+3)*Math.sin(dth/2)+0.05,H,8,0.6),arcM(tm,R+6.6,f*H+H/2));
      B.put('glass',uvBox(wi*0.42,1.25,0.08),arcM(tm-0.008,R+2.58,f*H+1.85));
      if(Math.round((th-CAMPUS.th0)/dth)%2===0)B.put('door',uvBox(0.95,2.2,0.08),arcM(tm+0.016,R+2.58,f*H+1.1));
      B.put('slab',uvBox(w,0.3,10.9),arcM(tm,R+5.2,f*H));
      if(f>0){B.put('rail',uvBox(wi,1.0,0.1),arcM(tm,R+0.1,f*H+0.65));B.put('slab',uvBox(wi,0.12,0.25),arcM(tm,R+0.1,f*H+1.16));}
    }
    B.put('slab',uvBox(w,0.45,12.0),arcM(tm,R+4.6,F*H+0.1));
    B.put('roof',uvBox(wi+0.02,0.9,0.35),arcM(tm,R-1.2,F*H+0.25));
    B.put('roof',uvBox(wi+0.02,0.25,1.6),arcM(tm,R-0.5,F*H-0.05));
    if(Math.round((th-CAMPUS.th0)/dth)%2===0)B.put('pinkSm',uvBox(0.55,F*H,0.55,0.8),arcM(th,R+0.15,F*H/2));
  }
  // big round window decoration
  {const th=-80*D2R;const [x,z]=polar(th,R-0.25);const ring=new THREE.Mesh(new THREE.TorusGeometry(2.3,0.35,10,40),mats.pinkSm);ring.position.set(x,6.2,z);ring.rotation.y=PI-th;sc.add(ring);
   const disc=new THREE.Mesh(new THREE.CircleGeometry(2.3,40),toon('#2f4c55'));disc.position.set(x,6.2,z);disc.rotation.y=PI-th+PI;disc.translateZ(0.05);sc.add(disc);}
  // yellow block + portal

  const all=CAMPUS.obs.concat([CAMPUS.portal]);
  for(const o of all){const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz),m=o.r+rad;if(d<m&&d>0.0001){p.x=o.x+dx/d*m;p.z=o.z+dz/d*m;}}
}

  const focus=[S.victim,GAME.spk].filter((c,i,a)=>c&&a.indexOf(c)===i&&S.actors.includes(c));
  for(const c of focus){if(!c.root.visible||c.root.parent!==curScene)continue;if(c===S.me&&rig.fp)continue;
    for(const fy of [0.88,0.55]){const p=new V3(0,(c.headY||1.1)*fy,0);c.root.localToWorld(p);if(!_fr.containsPoint(p))continue;const dir=p.clone().sub(cam);const L=dir.length();if(L<0.3||L>14)continue;dir.normalize();
      const h=occHit(curScene,cam,dir,L-0.15);if(h!=null){const need=Math.min(h+0.3,L-0.5,2.0);if(!best||need>best.need)best={need,dir};}}}

  keyLines:[S=>{S.mei.animSpeed=0.001;},['nar','你追到學妹小美背後，只差一點點就抓到了！'],['angel','這一次，你可以自己選。鬼抓人要怎麼「抓」，才不會讓人受傷呢？']],
  key:{q:'學妹小美就在你前面，你要怎麼抓她？',opts:[
    {t:'放慢腳步，輕拍她的肩膀，說「抓到了」',ok:true},
    {t:'抓她的衣服，但是只輕輕拉一下',v:'light',after:'就算只是輕輕一拉，正在跑步的小美還是失去平衡，往前撲倒。',why:'人在跑步的時候，衣服被往後拉一下，身體就會往前撲倒。'},
    {t:'從後面撲上去，抱住她',v:'hug',after:'你從後面撲上去，比你小的學妹被你壓著，一起重重摔在地上。',why:'另一個真實案例（#9）：六年級學生從後方撲倒同學，頭部鈍傷、門牙斷裂，判賠 11.5 萬元。'},
    {t:'伸腳絆她一下，她就會停下來',v:'trip',after:'小美被你絆到，整個人往前摔，臉直接撞到地上。',why:'推、拉、絆、抓都不行！絆倒別人可能造成很嚴重的傷害。'}]},
  async safe(S){const m=S.mei;m.animSpeed=1;
    await par(walkTo(m,new V3(0.0,0,9.75),1.4,'walk',{ease:easeO}),moveFP(new V3(1.35,1.38,10.05),1.4,'walk',new V3(-8,0.7,9.2),easeO));
    handTo(0.18,-0.12,-0.62);await wait(0.35);toast('（輕輕拍一下肩膀）「抓到了！」',1600);handTo(0.3,-0.45,-0.5,true);await wait(0.3);hand.visible=false;
    faceTo(m,1.35,10.05);m.setMood('joy');m.pose='idle';await tween(0.5,k=>rig.look.lerp(new V3(0,0.85,9.75),k*0.5));},
  safeLines:[['xiaomei','被學長抓到了！換我當鬼！'],['me','好！你數到十，我們一起用安全的方式玩。'],S=>{S.mei.pose='cheer';},
    ['angel','太棒了！玩鬼抓人用拍的，不推、不拉、不絆，也不抓衣服。']],
};

/* ================= LOOP & BOOT ================= */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const rdt=Math.min(0.05,(now-last)/1000);last=now;const dt=rdt*(GAME.speed||1);
  for(let i=0;i<tw.length;i++){const a=tw[i];a.t+=dt;const k=Math.min(1,a.t/a.d);a.f(a.ease(k));if(k>=1){tw.splice(i,1);i--;a.res();}}
  if(mode==='map')updateMap(rdt);else if(mode==='title')updateTitle(rdt);
  if(S&&S.tick)S.tick(dt);
  LIVE.forEach(c=>{if(c.root.parent===curScene)c.update(dt);});
  if(mode==='case')applyCam(dt);
  voiceTick();fxTick(rdt);
  camera.updateMatrixWorld();updateOverlay(dt);
  if(REC&&tw.length&&S)REC.push(snapState(S));
  const so=$('#story').classList.contains('on'),sk=so+':'+innerWidth+'x'+innerHeight;if(sk!==loop._so){loop._so=sk;if(so)camera.setViewOffset(innerWidth,innerHeight,0,innerHeight*0.13,innerWidth,innerHeight);else camera.clearViewOffset();}
  renderer.clear();renderer.render(curScene,camera);renderer.clearDepth();renderer.render(ov,camera);}
requestAnimationFrame(loop);

/* title & controls */
const MEID=()=>save.look.g==='g'?'me_g':'me_b';
function setLook(){if(hand){ov.remove(hand);hand=null;}thumbs.me=null;ROLE.me.p=save.look.g==='g'?1.45:1.2;
  campus.remove(player.root);LIVE.delete(player);
  if(GAME.vrmOK&&VCH[MEID()]){player=VRM_ME=VCH[MEID()];campus.add(player.root);player.root.visible=true;player.root.position.copy(MAP.pos);player.snap=true;}
  else{VRM_ME=null;player=kid(campus,LOOK(),[MAP.pos.x,0,MAP.pos.z],0);}LIVE.add(player);}
document.querySelectorAll('#title [data-g]').forEach(b=>b.onclick=()=>{SFX.click();save.look.g=b.dataset.g;document.querySelectorAll('#title [data-g]').forEach(x=>x.classList.toggle('on',x===b));setLook();});
document.querySelectorAll('#title [data-h]').forEach(b=>b.onclick=()=>{SFX.click();save.look.hair=b.dataset.h;document.querySelectorAll('#title [data-h]').forEach(x=>x.classList.toggle('on',x===b));setLook();});
document.querySelectorAll('#title [data-s]').forEach(b=>b.onclick=()=>{SFX.click();save.look.skin=b.dataset.s;document.querySelectorAll('#title [data-s]').forEach(x=>x.classList.toggle('on',x===b));setLook();});
document.querySelectorAll('#title [data-g]').forEach(x=>x.classList.toggle('on',x.dataset.g===save.look.g));
document.querySelectorAll('#title [data-h]').forEach(x=>x.classList.toggle('on',x.dataset.h===save.look.hair));
document.querySelectorAll('#title [data-s]').forEach(x=>x.classList.toggle('on',x.dataset.s===save.look.skin));
const HELP=`<h2>🎮 怎麼玩</h2><div class="tip" style="text-align:left">
  1️⃣ 右邊選一個<b>目的地</b>，跟著<b>黃色箭頭</b>走過去（電腦：WASD／方向鍵；手機：左下搖桿；也可以點地面）。<br>
  2️⃣ 走進發光的圓圈，按「進入情境」。<br>
  3️⃣ 畫面會變成<b>第一人稱</b>：😈 一開始，小惡魔會控制你，一步一步做出危險的事……<br>
  4️⃣ 悲劇發生後，😇 小天使會趕走小惡魔，讓<b>時光倒轉</b>，回到關鍵時刻，這次由你自己選。<br>
  5️⃣ 機會只有一次！選對了得到<b>安全徽章</b>，選錯了悲劇重演、遊戲結束。</div>
  <p style="font-size:14px;color:#7a7090">${SRC}。情境中的人物為虛構。</p><div class="btns"><button class="btn green" data-a="ok">我知道了</button></div>`;
$('#go').onclick=async()=>{ac();voiceUnlock();SFX.click();persist();$('#title').classList.add('hide');musicPlay('campus');ambience('campus');
  MAP.face=PI;MAP.camYaw=0;mode='map';GAME.state='map';player.pose='idle';renderHUD();$('#hud').classList.remove('hide');
  if(!save.seenHelp){save.seenHelp=true;persist();busy=true;await overlay(HELP);busy=false;}
  if(!MAP.target){const p=PLACES.find(p=>!save.done[p.id]);if(p){MAP.target=p.id;renderDest();}}};
$('#helpBtn').onclick=async()=>{if(busy&&mode!=='title')return;SFX.click();const b=busy;busy=true;await overlay(HELP);busy=b;};
$('#voiceBtn').onclick=()=>{const v=!isVoice();setVoice(v);$('#voiceBtn').textContent=v?'🔊':'🔇';toast(v?'語音與音效：開':'語音與音效：關');};
$('#musicBtn').onclick=()=>{MUS.on=!MUS.on;if(MUS.bus&&AC)MUS.bus.gain.setTargetAtTime(MUS.on?MUS.vol:0,AC.currentTime,0.2);$('#musicBtn').style.opacity=MUS.on?1:0.45;toast(MUS.on?'音樂：開':'音樂：關');};
async function bootVRM(){const go=$('#go');go.disabled=true;go.textContent='載入角色中…';
  try{const prog={me_b:0,me_g:0};const upd=()=>{go.textContent=`載入角色中… ${Math.round((prog.me_b+prog.me_g)*50)}%`;};
    await Promise.all(['me_b','me_g'].map(id=>loadBuf(id,f=>{prog[id]=f;upd();})));
    await getVRMChar('me_b');await getVRMChar('me_g');GAME.vrmOK=true;setLook();
    ['b','g'].forEach(g=>{const t=thumbFor('me_'+g);if(t){const e=$('#ph_'+g);e.style.backgroundImage=`url(${t})`;e.textContent='';}});
    document.querySelectorAll('#title .row')[1].classList.add('hide');
    loadVoice();
    ['xiaokai','teacher','xiaoyu','xiaomei'].reduce((p,id)=>p.then(()=>loadBuf(id).catch(()=>{})),Promise.resolve());
  }catch(e){console.warn('VRM 載入失敗，改用內建角色',e);GAME.vrmOK=false;}
  go.disabled=false;go.textContent='開始冒險 ▶';GAME.vrm=!!VRM_ME;GAME.ready=true;}
GAME.runCase=id=>{busy=true;$('#title').classList.add('hide');musicPlay('campus');return runCase(id);};
GAME.start=()=>$('#go').click();
window.__vp=voicePlay;GAME._dbg={fxRays,fxConfetti,fxHearts,fxSparks,bravo,walkTo,FX,rig,ROLE,VO,caseCard,CASES,SRC,MAP,PLACES,pl:()=>player,setMode:m=>mode=m,camera,setLook,save,VCH,getVRMChar,npc,campus,LIVE};
bootVRM();

</script>
